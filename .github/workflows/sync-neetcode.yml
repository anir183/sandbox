name: Sync NeetCode submissions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */3 * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout private submissions
        uses: actions/checkout@v4
        with:
          repository: anir183/neetcode
          token: ${{ secrets.NEETCODE_READ_TOKEN }}
          path: .neetcode-source
          persist-credentials: false

      - name: Sync submissions
        run: |
          mkdir -p neetcode

          rsync -a --delete \
            --exclude='.git/' \
            .neetcode-source/ neetcode/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add neetcode/

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync neetcode submissions"
            git push
          else
            echo "no changes to sync."
          fi
